<header class="site-header">
  <div class="header-inner">
    <div class="brand-row">
      <div class="brand-left">
        <button class="hamburger" id="hamburger-btn" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="mobile-menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="brand-block">
          <span class="brand-title" id="brand-title">HTML / CSS / JavaScript </span>
          <span class="brand-subtitle" id="brand-subtitle">Learning Center</span>
        </div>
      </div>
      <div class="top-controls">
        <div class="lang-container" id="desktop-langs">
            <button class="lang-btn active" type="button" data-lang="ko">🇰🇷 KO</button>

        <span class="status-badge status-ready" role="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span>준비 완료</span>

      </div>
    </div>

    <div class="nav-shell desktop-nav" aria-label="Lesson menu">
      <nav class="nav-container" id="nav-bar"></nav>
    </div>
  </div>

  <div class="mobile-menu" id="mobile-menu" aria-hidden="true" inert>
      <button class="web-a11y-only" id="mobile-menu-close" type="button" aria-label="메뉴 닫기" data-course-aria="closeMenu">×</button>

      <div class="mobile-lang-container" id="mobile-langs">

<main id="main-content" tabindex="-1">
  <section id="theory-panel" aria-label="핵심 이해" data-course-aria="theoryLabel">
    <div class="lesson-chip">Lesson 1</div>
    <div class="theory-content" id="theory-view">
      <p role="status">학습 자료를 준비하고 있어요.</p>
      <noscript><p>학습 자료와 실습 기능을 사용하려면 브라우저에서 JavaScript를 켜 주세요.</p></noscript>
    </div>
  </section>

  <section id="editor-panel" aria-labelledby="editor-heading">
    <div class="editor-topbar">
      <span class="editor-title" id="editor-heading" data-course-text="editorLabel">코드 실습</span>
    </div>

    <span class="web-a11y-only" id="editor-hint" data-course-text="editorHint">들여쓰기: Ctrl+] / 내어쓰기: Ctrl+[. Tab은 다음 버튼으로 이동합니다.</span>
    <textarea id="html-code" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="HTML, CSS, JavaScript code editor" aria-describedby="editor-hint"></textarea>

    <div class="action-btns">
      <button class="run-btn btn" id="run-btn" type="button">실행 ▶</button>
      <button class="reset-btn btn" id="reset-btn" type="button">초기화</button>
      <button class="ans-btn btn" id="answer-btn" type="button" aria-controls="ans-display" aria-expanded="false">정답 확인</button>
    </div>

    <div class="preview-wrap">
      <div class="preview-header">
        <span data-course-text="resultLabel">실행 결과 미리보기</span>
      </div>
      <iframe id="preview-frame" title="HTML preview" sandbox="allow-scripts"></iframe>
    </div>

    <div id="ans-display" role="region" aria-labelledby="answerTitle" hidden>
      <strong id="answerTitle">[모범 답안]</strong>
      <pre id="ans-text"></pre>
    </div>
  </section>
</main>
    <footer class="footer">

<script>
// A file URL cannot load this course's JavaScript modules. Explain the next step
// instead of leaving the initial loading message and inactive controls onscreen.
(function () {
  if (location.protocol !== 'file:') return;
  document.getElementById('theory-view').innerHTML = '<div class="info-box"><h2>📖 실행 안내 · How to open</h2><p>실습을 시작하려면 이 폴더를 웹서버로 열어 주세요. <a href="./README.md">README의 실행 방법</a>을 확인해 주세요.</p><p lang="en">Open this folder through a web server to use the lessons. See the README for the steps.</p><p lang="ru">Откройте эту папку через веб-сервер. Инструкция находится в README.</p></div>';
  document.querySelectorAll('button').forEach(function (button) { button.disabled = true; });
  document.getElementById('html-code').disabled = true;
  document.querySelector('.status-badge span:last-child').textContent = '실행 안내 · Setup';
})();
</script>
<script type="module" src="./js/data_web/web.js"></script>
